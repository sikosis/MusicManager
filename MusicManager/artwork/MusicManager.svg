<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"
    viewBox="0 0 64 64">
  <defs>
    <linearGradient id="caseBack" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#8fe8ff"/>
      <stop offset="0.38" stop-color="#20b9e8"/>
      <stop offset="1" stop-color="#0873be"/>
    </linearGradient>
    <linearGradient id="caseFront" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#28c9ef"/>
      <stop offset="0.48" stop-color="#078fd4"/>
      <stop offset="1" stop-color="#075aaf"/>
    </linearGradient>
    <radialGradient id="record" cx="0.3" cy="0.22" r="0.82">
      <stop offset="0" stop-color="#fffbd0"/>
      <stop offset="0.34" stop-color="#ffe96d"/>
      <stop offset="0.72" stop-color="#ffc52e"/>
      <stop offset="1" stop-color="#df8613"/>
    </radialGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8bd"/>
      <stop offset="1" stop-color="#f2bf32"/>
    </linearGradient>
  </defs>

  <!-- The blue back panel reads as both a record sleeve and a library bin. -->
  <path d="M13 7 L48 7 L55 14 L55 39 L9 39 L9 12 Z"
      fill="#075a9e" stroke="#30343b" stroke-width="2.4"
      stroke-linejoin="round"/>
  <path d="M14.5 9.5 L46.8 9.5 L52.5 15.2 L52.5 36.5 L11.5 36.5
      L11.5 13 Z" fill="url(#caseBack)"/>
  <path d="M14.5 10.5 L46.5 10.5 L51.5 15.5" fill="none"
      stroke="#d5f8ff" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round" opacity="0.9"/>
  <path d="M48 8.5 L53.5 14 L53.5 35" fill="none"
      stroke="#064e9c" stroke-width="2" stroke-linecap="round"/>

  <!-- A warm record keeps the icon legible against both light and dark desks. -->
  <circle cx="31.5" cy="28" r="19.5" fill="url(#record)"
      stroke="#3c342b" stroke-width="2.4"/>
  <circle cx="31.5" cy="28" r="15.2" fill="none"
      stroke="#d88718" stroke-width="1" opacity="0.75"/>
  <circle cx="31.5" cy="28" r="11.7" fill="none"
      stroke="#fff2a0" stroke-width="1" opacity="0.72"/>
  <path d="M19 20.5 A15.5 15.5 0 0 1 38.5 13.8" fill="none"
      stroke="#fffde4" stroke-width="2.4" stroke-linecap="round"
      opacity="0.82"/>
  <circle cx="31.5" cy="28" r="5.2" fill="#087fc7"
      stroke="#30343b" stroke-width="1.6"/>
  <circle cx="31.5" cy="28" r="1.5" fill="#fff8bd"/>

  <!-- The front bin turns the record into a managed collection. -->
  <path d="M7 35.5 L57 35.5 L52 58 L12 58 Z"
      fill="#07508d" stroke="#30343b" stroke-width="2.5"
      stroke-linejoin="round"/>
  <path d="M9.8 38 L54.2 38 L49.8 55.5 L14.2 55.5 Z"
      fill="url(#caseFront)"/>
  <path d="M10 38 L54 38 L52.8 42 L11.4 42 Z"
      fill="#73e0f4" opacity="0.72"/>
  <path d="M14.5 54.5 L49.5 54.5" fill="none" stroke="#064d99"
      stroke-width="1.4" opacity="0.9"/>

  <!-- A small indexed label stays recognisable at Haiku's common icon sizes. -->
  <path d="M23 43 L42 43 L40.5 53 L24.5 53 Z"
      fill="url(#label)" stroke="#6e4b19" stroke-width="1.5"
      stroke-linejoin="round"/>
  <path d="M30 46.2 L36.7 45.2 L36.7 48.8
      C35.4 48.4 33.8 48.8 33.4 49.8
      C33 50.9 34 51.7 35.4 51.4
      C36.5 51.2 37.3 50.5 37.3 49.5 L37.3 44.2 L30 45.4
      L30 48.6 C28.7 48.2 27.2 48.7 26.9 49.7
      C26.6 50.8 27.6 51.5 28.9 51.2
      C30 51 30.7 50.3 30.7 49.3 Z"
      fill="#075fab"/>
</svg>
